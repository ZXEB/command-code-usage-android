name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build release APK
        id: release
        continue-on-error: true
        run: ./gradlew :app:assembleRelease --stacktrace
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build debug APK (fallback when release is unsigned)
        if: steps.release.outcome == 'failure'
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Locate APKs
        id: apks
        run: |
          mkdir -p out
          found=0
          for f in app/build/outputs/apk/release/*.apk app/build/outputs/apk/debug/*.apk; do
            if [ -f "$f" ]; then
              base=$(basename "$f")
              cp "$f" "out/$base"
              echo "collected: $base"
              found=1
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::No APK produced"
            exit 1
          fi
          ls -la out

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cc-usage-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
          draft: false
